name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: '*'
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build:
    if: github.repository == 'nsiccha/NUTS.jl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
      - name: Redirect the former Quarto landing page
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'index.html';
            const branch = 'gh-pages';
            const html = '<!doctype html><html lang="en"><meta charset="utf-8"><title>NUTS.jl</title><meta http-equiv="refresh" content="0;url=dev/"><a href="dev/">NUTS.jl documentation</a></html>\n';
            const args = {...context.repo, path, ref: branch};
            let data;
            try {
              ({data} = await github.rest.repos.getContent(args));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(html).toString('base64');
            if (!data || data.content.replace(/\s/g, '') !== content) {
              await github.rest.repos.createOrUpdateFileContents({
                ...context.repo, path, branch, sha: data?.sha, content,
                message: 'Redirect documentation root to the current guide'
              });
            }
